name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: App icon banao
        run: |
          pip install pillow
          python make_icon.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK banao
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk LadooPop.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LadooPop-APK
          path: LadooPop.apk

      - name: Download link banao (Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ladoo Pop v1.0.${{ github.run_number }}
          body: Phone par download karke install karein.
          make_latest: true
          files: LadooPop.apk
